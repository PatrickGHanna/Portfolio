name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'backend/Portfolio.Api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}/Portfolio.Api.csproj

      - name: Build project
        run: dotnet build ${{ env.PROJECT_PATH }}/Portfolio.Api.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ${{ env.PROJECT_PATH }}/Portfolio.Api.csproj --configuration Release --no-build --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Backend App Service Name
        id: get_app_name
        uses: azure/CLI@v2
        with:
          inlineScript: |
            # Try to get app service name from secret first
            if [ -n "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then
              echo "Using app service name from secret: ${{ secrets.AZURE_WEBAPP_NAME }}"
              echo "app_name=${{ secrets.AZURE_WEBAPP_NAME }}" >> $GITHUB_OUTPUT
            # Otherwise, query for app service by name pattern
            else
              echo "Querying for backend app service..."
              # First, try to get resource group from secret
              RESOURCE_GROUP="${{ secrets.AZURE_RG }}"
              
              # If resource group is not set, search across all resource groups
              if [ -z "$RESOURCE_GROUP" ]; then
                echo "Resource group not specified, searching across all resource groups..."
                # Search for app service containing 'portfolio' and 'api' in any resource group
                APP_INFO=$(az webapp list --query "[?contains(name, 'portfolio') && contains(name, 'api')].{name:name, resourceGroup:resourceGroup}" -o tsv | head -n 1)
                if [ -n "$APP_INFO" ]; then
                  APP_NAME=$(echo "$APP_INFO" | cut -f1)
                  RESOURCE_GROUP=$(echo "$APP_INFO" | cut -f2)
                  echo "Found app service: $APP_NAME in resource group: $RESOURCE_GROUP"
                  echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
                  echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
                else
                  echo "Error: Could not find backend app service. Please set AZURE_WEBAPP_NAME or AZURE_RG secret."
                  exit 1
                fi
              else
                # Resource group is specified, query within that group
                echo "Querying in resource group: $RESOURCE_GROUP"
                
                # First, list all app services in the resource group for debugging
                echo "Listing all app services in resource group..."
                az webapp list --resource-group "$RESOURCE_GROUP" --query "[].{name:name, state:state}" -o table
                
                # Try multiple query patterns to find the backend app service
                # Pattern 1: Contains both 'portfolio' and 'api'
                APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'portfolio') && contains(name, 'api')].name" -o tsv | head -n 1)
                
                # Pattern 2: Contains 'api' (in case portfolio is in resource group name, not app name)
                if [ -z "$APP_NAME" ]; then
                  echo "Trying alternative pattern: app service with 'api' in name..."
                  APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'api')].name" -o tsv | head -n 1)
                fi
                
                # Pattern 3: Contains 'portfolio' (matches Terraform naming pattern)
                if [ -z "$APP_NAME" ]; then
                  echo "Trying alternative pattern: app service with 'portfolio' in name..."
                  APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'portfolio')].name" -o tsv | head -n 1)
                fi
                
                # Pattern 4: Any app service in the resource group (last resort)
                if [ -z "$APP_NAME" ]; then
                  echo "Trying to get any app service in resource group..."
                  APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
                fi
                
                if [ -z "$APP_NAME" ]; then
                  echo "Error: Could not find any app service in resource group: $RESOURCE_GROUP"
                  echo ""
                  echo "Available app services in resource group:"
                  az webapp list --resource-group "$RESOURCE_GROUP" --query "[].name" -o table || echo "Could not list app services"
                  echo ""
                  echo "Please verify:"
                  echo "1. The resource group name is correct"
                  echo "2. The app service has been created (run terraform apply if needed)"
                  echo "3. Or set AZURE_WEBAPP_NAME secret with the exact app service name"
                  exit 1
                fi
                echo "Found app service: $APP_NAME"
                echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
                echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
              fi
            fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.get_app_name.outputs.app_name }}
          package: ./publish
          startup-command: 'dotnet Portfolio.Api.dll'

      - name: Configure App Settings - CORS
        uses: azure/CLI@v2
        with:
          inlineScript: |
            RESOURCE_GROUP="${{ steps.get_app_name.outputs.resource_group || secrets.AZURE_RG }}"
            if [ -z "$RESOURCE_GROUP" ]; then
              echo "Error: Resource group not found. Please set AZURE_RG secret."
              exit 1
            fi
            az webapp config appsettings set \
              --name ${{ steps.get_app_name.outputs.app_name }} \
              --resource-group "$RESOURCE_GROUP" \
              --settings CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}"

      - name: Configure App Settings - Application Insights
        uses: azure/CLI@v2
        with:
          inlineScript: |
            RESOURCE_GROUP="${{ steps.get_app_name.outputs.resource_group || secrets.AZURE_RG }}"
            if [ -z "$RESOURCE_GROUP" ]; then
              echo "Error: Resource group not found. Please set AZURE_RG secret."
              exit 1
            fi
            az webapp config appsettings set \
              --name ${{ steps.get_app_name.outputs.app_name }} \
              --resource-group "$RESOURCE_GROUP" \
              --settings ApplicationInsights__ConnectionString="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}"

      - name: Azure Logout
        run: az logout
