name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'backend/Portfolio.Api'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}/Portfolio.Api.csproj

      - name: Build project
        run: dotnet build ${{ env.PROJECT_PATH }}/Portfolio.Api.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ${{ env.PROJECT_PATH }}/Portfolio.Api.csproj --configuration Release --no-build --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Backend App Service Name
        id: get_app_name
        uses: azure/CLI@v2
        with:
          inlineScript: |
            # Try to get app service name from secret first, otherwise query dynamically
            if [ -n "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then
              echo "Using app service name from secret: ${{ secrets.AZURE_WEBAPP_NAME }}"
              echo "app_name=${{ secrets.AZURE_WEBAPP_NAME }}" >> $GITHUB_OUTPUT
            else
              echo "Querying for app service name in resource group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
              APP_NAME=$(az webapp list --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query "[?contains(name, 'portfolio') && contains(name, 'api')].name" -o tsv | head -n 1)
              if [ -z "$APP_NAME" ]; then
                echo "Error: Could not find backend app service in resource group"
                exit 1
              fi
              echo "Found app service: $APP_NAME"
              echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
            fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.get_app_name.outputs.app_name }}
          package: ./publish
          startup-command: 'dotnet Portfolio.Api.dll'

      - name: Configure App Settings - CORS
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ steps.get_app_name.outputs.app_name }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --settings CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}"

      - name: Configure App Settings - Application Insights
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ steps.get_app_name.outputs.app_name }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --settings ApplicationInsights__ConnectionString="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}"

      - name: Azure Logout
        run: az logout
