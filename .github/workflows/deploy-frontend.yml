name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  APP_LOCATION: 'frontend'
  OUTPUT_LOCATION: 'dist'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.APP_LOCATION }}
        run: npm ci

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Backend API URL
        id: get_api_url
        uses: azure/CLI@v2
        with:
          inlineScript: |
            # Try to get API URL from variable or secret (variable takes precedence)
            API_URL_VAR="${{ vars.VITE_APP_API_URL }}"
            API_URL_SECRET="${{ secrets.VITE_APP_API_URL }}"
            RESOURCE_GROUP_VAR="${{ vars.AZURE_RG }}"
            RESOURCE_GROUP_SECRET="${{ secrets.AZURE_RG }}"
            
            # Use variable if set, otherwise fall back to secret
            API_URL="${API_URL_VAR:-$API_URL_SECRET}"
            RESOURCE_GROUP="${RESOURCE_GROUP_VAR:-$RESOURCE_GROUP_SECRET}"
            
            if [ -n "$API_URL" ]; then
              echo "Using API URL from variable/secret: $API_URL"
              echo "api_url=$API_URL" >> $GITHUB_OUTPUT
            # Otherwise, query Azure for backend App Service URL
            else
              echo "Querying Azure for backend App Service URL..."
              
              # If resource group is not set, search across all resource groups
              if [ -z "$RESOURCE_GROUP" ]; then
                echo "Resource group not specified, searching across all resource groups..."
                # Search for app service containing 'portfolio' and 'api' in any resource group
                APP_INFO=$(az webapp list --query "[?contains(name, 'portfolio') && contains(name, 'api')].{name:name, resourceGroup:resourceGroup}" -o tsv | head -n 1)
                if [ -n "$APP_INFO" ]; then
                  APP_NAME=$(echo "$APP_INFO" | cut -f1)
                  RESOURCE_GROUP=$(echo "$APP_INFO" | cut -f2)
                  echo "Found app service: $APP_NAME in resource group: $RESOURCE_GROUP"
                else
                  echo "Error: Could not find backend app service. Please set VITE_APP_API_URL or AZURE_RG variable/secret."
                  exit 1
                fi
              else
                # Resource group is specified, query within that group
                echo "Querying in resource group: $RESOURCE_GROUP"
                
                # Try multiple query patterns to find the backend app service
                # Pattern 1: Contains both 'portfolio' and 'api'
                APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'portfolio') && contains(name, 'api')].name" -o tsv | head -n 1)
                
                # Pattern 2: Contains 'api' (in case portfolio is in resource group name, not app name)
                if [ -z "$APP_NAME" ]; then
                  echo "Trying alternative pattern: app service with 'api' in name..."
                  APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'api')].name" -o tsv | head -n 1)
                fi
                
                # Pattern 3: Contains 'portfolio' (matches Terraform naming pattern)
                if [ -z "$APP_NAME" ]; then
                  echo "Trying alternative pattern: app service with 'portfolio' in name..."
                  APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[?contains(name, 'portfolio')].name" -o tsv | head -n 1)
                fi
                
                # Pattern 4: Any app service in the resource group (last resort)
                if [ -z "$APP_NAME" ]; then
                  echo "Trying to get any app service in resource group..."
                  APP_NAME=$(az webapp list --resource-group "$RESOURCE_GROUP" --query "[0].name" -o tsv)
                fi
                
                if [ -z "$APP_NAME" ]; then
                  echo "Error: Could not find any app service in resource group: $RESOURCE_GROUP"
                  echo ""
                  echo "Available app services in resource group:"
                  az webapp list --resource-group "$RESOURCE_GROUP" --query "[].name" -o table || echo "Could not list app services"
                  echo ""
                  echo "Please verify:"
                  echo "1. The resource group name is correct"
                  echo "2. The app service has been created (run terraform apply if needed)"
                  echo "3. Or set VITE_APP_API_URL variable/secret with the API URL"
                  exit 1
                fi
                echo "Found app service: $APP_NAME"
              fi
              
              # Get the default hostname of the app service
              echo "Getting default hostname for app service: $APP_NAME"
              HOSTNAME=$(az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)
              
              if [ -z "$HOSTNAME" ]; then
                echo "Error: Could not retrieve hostname for app service: $APP_NAME"
                exit 1
              fi
              
              # Construct the API URL
              API_URL="https://${HOSTNAME}/api"
              echo "Backend API URL: $API_URL"
              echo "api_url=$API_URL" >> $GITHUB_OUTPUT
            fi
            
            # Verify output was set
            if [ -z "$API_URL" ] && [ -z "$API_URL_VAR" ] && [ -z "$API_URL_SECRET" ]; then
              echo "Error: Failed to determine API URL"
              echo "Please set VITE_APP_API_URL as a variable or secret, or set AZURE_RG to enable Azure query"
              exit 1
            fi
            echo "API URL: $API_URL"

      - name: Build frontend
        working-directory: ${{ env.APP_LOCATION }}
        env:
          VITE_APP_API_URL: ${{ steps.get_api_url.outputs.api_url}}
        run: npm run build

      - name: Azure Logout
        run: az logout

      - name: Verify dist folder contents before deployment
        run: |
          echo "=== Contents of output (${{ env.OUTPUT_LOCATION }}) folder ==="
          ls -la "${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}/"
          echo ""
          echo "=== index.html content ==="
          cat "${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}/index.html"
          echo ""
          echo "=== Checking for source index.html ==="
          if [ -f "${{ env.APP_LOCATION }}/index.html" ]; then
            echo "WARNING: Source index.html exists at ${{ env.APP_LOCATION }}/index.html"
            echo "Content:"
            cat "${{ env.APP_LOCATION }}/index.html"
          fi

      - name: Verify Build Output
        run: |
          echo "Checking build output in ${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}..."
          ls -la "${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}/" || echo "Directory not found"
          echo ""
          echo "Checking index.html content:"
          if [ -f "${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}/index.html" ]; then
            cat "${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}/index.html"
            echo ""
            echo "✓ Built index.html found"
            if grep -q "/src/main.jsx" "${{ env.APP_LOCATION }}/${{ env.OUTPUT_LOCATION }}/index.html"; then
              echo "::error::ERROR: Built index.html still references /src/main.jsx instead of built assets!"
              exit 1
            fi
          else
            echo "::error::ERROR: Built index.html not found!"
            exit 1
          fi

      - name: Validate Deployment Token
        id: validate_token
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN secret is not set"
            echo ""
            echo "To get the deployment token:"
            echo "1. Go to Azure Portal: https://portal.azure.com"
            echo "2. Navigate to your Static Web App resource"
            echo "3. Click on 'Manage deployment token' in the left menu"
            echo "4. Copy the deployment token"
            echo "5. Go to GitHub: Settings → Secrets and variables → Actions"
            echo "6. Click 'New repository secret'"
            echo "7. Name: AZURE_STATIC_WEB_APPS_API_TOKEN"
            echo "8. Value: (paste the token)"
            echo "9. Click 'Add secret'"
            echo ""
            echo "Alternatively, you can get it via Azure CLI:"
            echo "  az staticwebapp secrets list --name <static-web-app-name> --resource-group <resource-group> --query 'properties.apiKey' -o tsv"
            exit 1
          fi
          echo "Deployment token found"


      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: "frontend"
          app_artifact_location: "/dist"
          skip_app_build: false
